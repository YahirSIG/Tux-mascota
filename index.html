<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tux-mascotas | Reporte y Búsqueda</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="loading-overlay" id="loader">
        <div class="text-center bg-white p-4 rounded-3 shadow">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2 fw-bold text-success">Procesando...</p>
        </div>
    </div>

    <nav class="navbar navbar-dark bg-success shadow fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-paws-fill"></i> Tux-mascotas
            </a>
            <button class="btn btn-warning btn-sm fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalReporte">
                <i class="bi bi-camera-fill"></i> REPORTAR
            </button>
        </div>
    </nav>

    <div id="map"></div>

    <div class="modal fade" id="modalReporte" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="bi bi-plus-circle"></i> Nuevo Reporte</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formMascota">
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Estatus</label>
                            <select id="tipo" class="form-select border-success" required>
                                <option value="perdido">Extraviado (Se busca)</option>
                                <option value="avistamiento">Avistamiento (Visto en calle)</option>
                                <option value="maltrato">Reporte de Maltrato</option>
                            </select>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-bold small">Especie</label>
                                <input type="text" id="especie" class="form-control" placeholder="Ej. Perro" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold small">Raza</label>
                                <input type="text" id="raza" class="form-control" placeholder="Ej. Criollo">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">Nombre / Señas Particulares</label>
                            <textarea id="senas" class="form-control" rows="2" placeholder="Describa a la mascota..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">Contacto</label>
                            <input type="text" id="contacto" class="form-control" placeholder="Teléfono o WhatsApp" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">Foto (Cámara o Galería)</label>
                            <input type="file" id="foto" class="form-control" accept="image/*" required>
                            <div id="preview-container" class="mt-2 text-center d-none">
                                <img id="img-preview" src="" class="img-thumbnail" style="max-height: 150px;">
                            </div>
                        </div>

                        <div class="alert alert-info py-2 small mb-0">
                            <i class="bi bi-geo-alt-fill"></i> <b>Ubicación:</b> Selecciona el punto exacto en el mapa.
                        </div>

                        <input type="hidden" id="lat">
                        <input type="hidden" id="lng">
                        
                        <div class="modal-footer px-0 pb-0 mt-3">
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">PUBLICAR REPORTE</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalFoto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-dark border-0">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white"><i class="bi bi-image"></i> Vista Detallada</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center p-0">
                    <img id="img-gran-vista" src="" class="img-fluid" style="max-height: 80vh;">
                </div>
                <div class="modal-footer border-0 justify-content-center">
                    <a id="btn-descargar" href="#" target="_blank" class="btn btn-warning fw-bold">
                        <i class="bi bi-download"></i> ABRIR / GUARDAR
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
