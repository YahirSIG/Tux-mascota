<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tux-mascotas</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="loading-overlay" id="loader">
        <div class="spinner-border text-success" style="width: 3rem; height: 3rem;"></div>
        <p class="mt-3 fw-bold text-success fs-5">Procesando...</p>
    </div>

    <nav class="navbar navbar-dark bg-success shadow fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-paws-fill"></i> Tux-mascotas
            </a>
            <button class="btn btn-warning btn-sm fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalReporte">
                <i class="bi bi-camera-fill"></i> REPORTAR
            </button>
        </div>
    </nav>

    <div id="map"></div>

    <div class="modal fade" id="modalReporte" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content shadow border-0">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Nuevo Reporte</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formMascota">
                        <div class="mb-3">
                            <label class="fw-bold small">Tipo</label>
                            <select id="tipo" class="form-select border-success" required>
                                <option value="perdido">Extraviado</option>
                                <option value="avistamiento">Avistamiento</option>
                                <option value="maltrato">Maltrato</option>
                            </select>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <input type="text" id="especie" class="form-control" placeholder="Especie" required>
                            </div>
                            <div class="col-6">
                                <input type="text" id="raza" class="form-control" placeholder="Raza">
                            </div>
                        </div>
                        <div class="mb-3">
                            <textarea id="senas" class="form-control" rows="2" placeholder="Detalles..."></textarea>
                        </div>
                        <div class="mb-3">
                            <input type="text" id="contacto" class="form-control" placeholder="Contacto" required>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold small">Foto</label>
                            <input type="file" id="foto" class="form-control" accept="image/*" required>
                            <div id="preview-container" class="mt-2 text-center d-none">
                                <img id="img-preview" src="" class="img-thumbnail" style="max-height: 150px;">
                            </div>
                        </div>
                        <div class="alert alert-warning py-2 small mb-0">
                            Ubicación: Toca el mapa.
                        </div>
                        <input type="hidden" id="lat"><input type="hidden" id="lng">
                        <div class="mt-3">
                            <button type="submit" class="btn btn-success w-100 fw-bold">ENVIAR</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalFoto" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-dark border-0">
                <div class="modal-header border-0">
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center p-0">
                    <img id="img-gran-vista" src="" class="img-fluid" style="max-height: 80vh;">
                </div>
                <div class="modal-footer border-0 justify-content-center">
                    <a id="btn-descargar" href="#" target="_blank" class="btn btn-warning fw-bold">DESCARGAR</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
